<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto R:R Calc</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Crypto%20Risk%20Reward%20Calculator%22,%22short_name%22:%22RR%20Calc%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#121824%22,%22theme_color%22:%22#1e293b%22,%22orientation%22:%22portrait%22}">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg-main: #121824;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .output-card {
            margin-top: 24px;
            border-top: 2px dashed var(--border);
            padding-top: 20px;
        }

        .result-box {
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-box.reward {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .result-box.risk {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .reward .result-header { color: var(--accent-green); }
        .risk .result-header { color: var(--accent-red); }

        .result-val {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .result-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .real-ratio-box {
            text-align: center;
            font-size: 0.9rem;
            background-color: var(--bg-main);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 14px;
        }
        
        .real-ratio-box strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Crypto R:R Calculator</h2>
    
    <div class="input-group">
        <label for="capital">Capital (RM)</label>
        <input type="number" id="capital" value="100" step="any" inputmode="decimal">
    </div>

    <div class="row">
        <div class="input-group">
            <label for="entryPrice">Entry Price (RM)</label>
            <input type="number" id="entryPrice" value="0.080" step="any" inputmode="decimal">
        </div>
        <div class="input-group">
            <label for="stopLoss">Stop Loss Price (RM)</label>
            <input type="number" id="stopLoss" value="0.074" step="any" inputmode="decimal">
        </div>
    </div>

    <div class="row">
        <div class="input-group">
            <label for="rrRatio">Target R:R Ratio (1 : X)</label>
            <input type="number" id="rrRatio" value="2" step="any" inputmode="decimal">
        </div>
        <div class="input-group">
            <label for="feePercent">Transaction Fee (%)</label>
            <input type="number" id="feePercent" value="0.6" step="any" inputmode="decimal">
        </div>
    </div>

    <div class="output-card">
        <div class="result-box reward">
            <div class="result-header">
                <span>Target Take Profit</span>
                <span id="tpPriceText">RM 0.00</span>
            </div>
            <div class="result-val" id="netRewardText">+RM 0.00</div>
            <div class="result-sub">
                <span id="grossRewardText">Gross: +RM 0.00</span>
                <span id="rewardFeesText">Total Fees: RM 0.00</span>
            </div>
        </div>

        <div class="result-box risk">
            <div class="result-header">
                <span>Stop Loss Target</span>
                <span id="slPriceText">RM 0.00</span>
            </div>
            <div class="result-val" id="netRiskText">-RM 0.00</div>
            <div class="result-sub">
                <span id="grossRiskText">Gross: -RM 0.00</span>
                <span id="riskFeesText">Total Fees: RM 0.00</span>
            </div>
        </div>

        <div class="real-ratio-box" id="netRatioBox">
            Net Realized Risk-Reward Ratio: <strong id="netRatioText">1 : 0.00</strong>
        </div>
    </div>
</div>

<script>
    const ids = ['capital', 'entryPrice', 'stopLoss', 'rrRatio', 'feePercent'];
    const fields = {};
    ids.forEach(id => {
        fields[id] = document.getElementById(id);
    });

    const outputs = {
        tpPriceText: document.getElementById('tpPriceText'),
        netRewardText: document.getElementById('netRewardText'),
        grossRewardText: document.getElementById('grossRewardText'),
        rewardFeesText: document.getElementById('rewardFeesText'),
        slPriceText: document.getElementById('slPriceText'),
        netRiskText: document.getElementById('netRiskText'),
        grossRiskText: document.getElementById('grossRiskText'),
        riskFeesText: document.getElementById('riskFeesText'),
        netRatioText: document.getElementById('netRatioText')
    };

    function calculate() {
        const capital = Number(fields.capital.value) || 0;
        const entryPrice = Number(fields.entryPrice.value) || 0;
        const stopLoss = Number(fields.stopLoss.value) || 0;
        const targetRR = Number(fields.rrRatio.value) || 0;
        const feeRate = (Number(fields.feePercent.value) || 0) / 100;

        if (capital <= 0 || entryPrice <= 0 || stopLoss >= entryPrice) {
            outputs.tpPriceText.textContent = "RM 0.00";
            outputs.netRewardText.textContent = "+RM 0.00";
            outputs.grossRewardText.textContent = "Gross: +RM 0.00";
            outputs.rewardFeesText.textContent = "Total Fees: RM 0.00";
            outputs.slPriceText.textContent = "RM 0.00";
            outputs.netRiskText.textContent = "-RM 0.00";
            outputs.grossRiskText.textContent = "Gross: -RM 0.00";
            outputs.riskFeesText.textContent = "Total Fees: RM 0.00";
            outputs.netRatioText.textContent = "1 : 0.00";
            return;
        }

        const coinsPurchased = capital / entryPrice;
        const buyFee = capital * feeRate;

        // Risk math
        const grossLoss = (entryPrice - stopLoss) * coinsPurchased;
        const sellLossValue = stopLoss * coinsPurchased;
        const sellRiskFee = sellLossValue * feeRate;
        const totalRiskFees = buyFee + sellRiskFee;
        const netRisk = grossLoss + totalRiskFees;

        // Reward math
        const priceRiskDistance = entryPrice - stopLoss;
        const takeProfitPrice = entryPrice + (priceRiskDistance * targetRR);
        
        const grossProfit = (takeProfitPrice - entryPrice) * coinsPurchased;
        const sellProfitValue = takeProfitPrice * coinsPurchased;
        const sellRewardFee = sellProfitValue * feeRate;
        const totalRewardFees = buyFee + sellRewardFee;
        const netReward = grossProfit - totalRewardFees;

        const netRealizedRatio = netRisk > 0 ? (netReward / netRisk).toFixed(2) : "0.00";

        // Display results
        outputs.tpPriceText.textContent = `RM ${takeProfitPrice.toFixed(4)}`;
        outputs.netRewardText.textContent = `+RM ${netReward.toFixed(2)}`;
        outputs.grossRewardText.textContent = `Gross: +RM ${grossProfit.toFixed(2)}`;
        outputs.rewardFeesText.textContent = `Total Fees: RM ${totalRewardFees.toFixed(2)}`;

        outputs.slPriceText.textContent = `RM ${stopLoss.toFixed(4)}`;
        outputs.netRiskText.textContent = `-RM ${netRisk.toFixed(2)}`;
        outputs.grossRiskText.textContent = Gross: -RM ${grossLoss.toFixed(2)};
        outputs.riskFeesText.textContent = Total Fees: RM ${totalRiskFees.toFixed(2)};
        outputs.netRatioText.textContent = 1 : ${netRealizedRatio};}// Monitor value changes instantly across all mobile browsersids.forEach(id => {const inputEl = fields[id];inputEl.addEventListener('input', calculate);inputEl.addEventListener('change', calculate);inputEl.addEventListener('keyup', calculate);});// Run immediately on page loadwindow.addEventListener('DOMContentLoaded', calculate);calculate();
